<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo Property Shortlist</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/filters.css">
  <link rel="stylesheet" href="styles/station-meta.css">
  <link rel="stylesheet" href="styles/notes-ratings.css">
  <link rel="stylesheet" href="styles/tags-modal.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
  <h1>🏠 Tokyo Property Shortlist</h1>
  <div class="filters">
    <span class="sort-wrap">
      <span class="select-prefix">
        <span class="select-prefix-label">Sort:</span>
	        <select id="sort-by" aria-label="Sort">
	          <option value="rating">Rating</option>
	          <option value="neighborhood_rating">Neighborhood</option>
	          <option value="transit_rating">Transit</option>
	          <option value="interior_rating">Interior</option>
	          <option value="date">Date Added</option>
	          <option value="price">Price ↑</option>
	          <option value="cpsqm">¥/Sqm</option>
	          <option value="sqm">Sqm ↓</option>
	          <option value="walk">Walk</option>
	          <option value="train">Train Time</option>
	          <option value="total">Total Transit</option>
	        </select>
      </span>
    </span>
    <span class="hide-wrap">
      <button type="button" class="hide-toggle" id="hide-toggle" aria-expanded="false">Hide</button>
      <div class="hide-menu" id="hide-menu">
        <label><input type="checkbox" id="hide-unstarred"> Unstarred</label>
        <label><input type="checkbox" id="hide-sold" checked> Sold</label>
        <label><input type="checkbox" id="hide-vetoed"> Vetoed</label>
        <label><input type="checkbox" id="hide-notes"> Notes</label>
      </div>
    </span>
    <span class="show-only-wrap">
      <button type="button" class="show-only-toggle" id="show-only-toggle" aria-expanded="false">Show Only</button>
      <div class="show-only-menu" id="show-only-menu">
        <label><input type="checkbox" id="hide-unsold"> Sold</label>
        <label><input type="checkbox" id="hide-unvetoed"> Vetoed</label>
      </div>
    </span>
  </div>
  

  <div id="app-status" class="app-status" role="status">
    <span class="app-status-message">Loading properties…</span>
    <button type="button" class="app-retry" hidden>Retry</button>
  </div>
  <noscript>This shortlist needs JavaScript to load the current properties.</noscript>

  <div class="footer">
    <p>Built with ❤️ by juan</p>
  </div>
  <script src="notes-config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="js/core/status.js"></script>
  <script src="js/core/config.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/features/properties/render.js"></script>
  <script src="js/features/properties/edit-modal.js"></script>
  <script src="js/features/properties/card-sync.js"></script>
  <script src="js/features/ui/preferences.js"></script>
  <script src="js/features/ui/card-metrics.js"></script>
  <script src="js/features/ui/sort-filters.js"></script>
  <script src="js/features/flags/stars-filters.js"></script>
  <script src="js/features/ui/panels.js"></script>
  <script src="js/features/ratings/index.js"></script>
  <script src="js/features/notes/index.js"></script>
  <script src="js/app/bootstrap.js"></script>
</body>
</html>
